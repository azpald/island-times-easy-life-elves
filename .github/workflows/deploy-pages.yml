      #     rsync -av --delete \
      #       --exclude 'dist' \
      #       --exclude '.git' \
      #       --exclude '.github' \
      #       ./ dist/

      #     # remove files you do not want published
      #     rm -rf dist/.git dist/.github

      - name: Run build
        run: python3 build.py

      # - name: Replace variables in HTML files
      #   env:
      #     API_URL: ${{ vars.API_URL }}
      #     APP_ENV: ${{ vars.APP_ENV }}
      #   run: |
      #     python3 <<'PY'
      #     from pathlib import Path
      #     import os

      #     replacements = {
      #         "__API_URL__": os.environ.get("API_URL", ""),
